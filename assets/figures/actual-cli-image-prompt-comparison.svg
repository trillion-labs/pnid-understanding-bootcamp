<text x="165" y="550" font-size="19" font-weight="400" text-anchor="start" fill="#182237">확인 순서는 motor와 joint 구분을 도왔지만 연결 관계 판단을 자동으로 해결하지는 못했습니다.</text>
<text x="70" y="620" font-size="14" font-weight="400" text-anchor="start" fill="#778399">점수는 제공된 기준 답안에 따른 수동 검토입니다. 전체 응답과 CLI 사용량은 실험 폴더에 보존했습니다.</text>
